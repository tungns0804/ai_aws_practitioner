name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cần quyền ghi để đẩy bản build sang nhánh gh-pages.
permissions:
  contents: write

# Chỉ cho phép 1 lượt deploy chạy tại một thời điểm.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sinh lại ngân hàng câu hỏi từ data/. Bước này cũng là lớp kiểm tra cuối:
      # dữ liệu không hợp lệ sẽ làm hỏng build thay vì lặng lẽ lên production.
      - name: Build data
        run: npm run build:data

      - name: Fail if generated data differs from committed data
        run: git diff --exit-code -- public/

      # base-href phải khớp đường dẫn con của GitHub Pages: /<tên-repo>/
      - name: Build
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Publish to gh-pages
        working-directory: dist/ai-aws-practitioner/browser
        run: |
          touch .nojekyll   # tắt Jekyll để file bắt đầu bằng "_" không bị loại
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
